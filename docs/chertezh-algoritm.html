<!DOCTYPE html>
<html lang="ru">
<head>

    <style>

        .sheet { position: relative; width: 900px; max-width: 100%; margin: 0 auto; background: #fff; border: 1px solid #000; padding-bottom: 70px; }

        .title-block td { border: 1px solid #000; padding: 2px 4px; }

</head>
